version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    groups:
      npm-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 3
  - package-ecosystem: cargo
    directory: /src-tauri
    target-branch: main
    schedule:
      interval: monthly
    groups:
      cargo-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    groups:
      actions-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

name: Bug report
description: Report a reproducible problem with Mac Terminal.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, access tokens, private keys, or sensitive terminal output.
        For security vulnerabilities, use the private reporting link instead.
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version and Mac architecture
      placeholder: macOS 15, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Share safe, minimal steps. Remove secrets and private output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true

[package]
name = "mac-terminal"
version = "0.2.0"
description = "A fast, local-first terminal emulator for macOS."
license = "MIT"
repository = "https://github.com/Davin-X/mac-terminal"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
